<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photography — Erga Indarwan</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    .photo-page-section { background: var(--bg); padding: 2rem 0 6rem; }

    /* Masonry grid */
    .photo-grid { 
      columns: 3; 
      column-gap: 1rem; 
      width: 100%;
    }
    @media (max-width: 860px) { .photo-grid { columns: 2; } }
    @media (max-width: 500px)  { .photo-grid { columns: 1; } }

    .photo-item {
      break-inside: avoid;
      margin-bottom: 1rem;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      border: 1px solid var(--border-md);
      background: var(--bg-card);
    }
    .photo-item img {
      width: 100%; display: block;
      transition: transform 0.5s var(--ease-out);
    }
    .photo-item:hover img { transform: scale(1.03); }
    
    .photo-overlay {
      position: absolute; inset: 0;
      background: rgba(30,30,28,0);
      transition: background var(--transition);
    }
    .photo-item:hover .photo-overlay { background: rgba(30,30,28,0.15); }
    
    .photo-caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 0.6rem 0.85rem;
      background: linear-gradient(to top, rgba(30,30,28,0.6), transparent);
      font-family: var(--ff-mono);
      font-size: 0.65rem;
      color: rgba(244,241,235,0.9);
      letter-spacing: 0.06em;
      opacity: 0;
      transition: opacity var(--transition);
    }
    .photo-item:hover .photo-caption { opacity: 1; }

    /* ── Lightbox ── */
    .lightbox {
      display: none;
      position: fixed; inset: 0;
      z-index: 600;
      background: rgba(20,20,18,0.94);
      backdrop-filter: blur(10px);
      align-items: center; justify-content: center;
      flex-direction: column;
    }
    .lightbox.open { display: flex; }
    .lightbox-close {
      position: absolute; top: 1.5rem; right: 1.5rem;
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(244,241,235,0.1); color: #fff;
      font-size: 1.2rem; border: none; cursor: pointer;
    }
    .lightbox-img {
      max-width: 90vw; max-height: 80vh;
      object-fit: contain; border-radius: 8px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.5);
    }
    .lightbox-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(244,241,235,0.1); color: #fff;
      width: 48px; height: 48px; border-radius: 50%;
      border: none; cursor: pointer; font-size: 1.8rem;
    }
    .lightbox-prev { left: 1.5rem; }
    .lightbox-next { right: 1.5rem; }
    .lightbox-info {
      position: absolute; bottom: 2rem;
      font-family: var(--ff-mono); font-size: 0.75rem;
      color: rgba(244,241,235,0.6);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-name"><a href="index.html">Erga Indarwan</a></div>
    <nav class="header-nav">
      <a href="interests.html">Interests</a>
      <a href="projects.html">Projects</a>
      <a href="photography.html" class="active">Photography</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <div class="header-role">Coder &amp; Engineer</div>
  </header>

  <section class="page-hero">
    <div class="page-hero-inner">
      <div class="section-tag reveal">Photography</div>
      <h1 class="page-hero-title reveal">Captured<br /><em>Moments.</em></h1>
      <p class="page-hero-sub reveal" data-delay="100">A collection of scenes from places I've been.</p>
    </div>
    <div class="page-hero-bg-text" aria-hidden="true">PHOTOS</div>
  </section>

  <section class="section photo-page-section">
    <div class="section-inner">
      <div class="photo-grid" id="photoGrid"></div>
    </div>
  </section>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <button class="lightbox-nav lightbox-prev" onclick="lightboxStep(-1)">‹</button>
    <img class="lightbox-img" id="lightboxImg" src="" alt="" />
    <button class="lightbox-nav lightbox-next" onclick="lightboxStep(1)">›</button>
    <div class="lightbox-info" id="lightboxInfo"></div>
  </div>

  <footer class="site-footer">
    <span>© 2025 Erga Indarwan</span>
  </footer>

  <script src="script.js"></script>
  <script>
    /* ═══════════════════════════════════════════════════════════════
        ✏️ YOUR PHOTOS — List your local file names here
       ═══════════════════════════════════════════════════════════════ */
    const PHOTOS = [
      { url: 'photo1indonesia.jpg', caption: 'Bali, 2023' },
      { url: 'photo3indonesia.jpg', caption: 'Tokyo Skyline' },
      { url: 'photo4indonesia.jpg', caption: 'Shibuya Crossing' },
      { url: 'photo5indonesiaa.jpg', caption: 'Marina Bay' },
      { url: 'photo6indonesia.jpg', caption: 'Gardens by the Bay' },
      { url: 'photo2indonesia.jpg', caption: 'Ubud Rice Fields' },
      // Add more local files as needed...
    ];

    /* ═══════════════════════════════════════════════════════════════
        Engine
       ═══════════════════════════════════════════════════════════════ */
    const grid = document.getElementById('photoGrid');
    
    PHOTOS.forEach((photo, idx) => {
      const item = document.createElement('div');
      item.className = 'photo-item reveal';
      item.style.transitionDelay = (idx * 50) + 'ms';
      item.innerHTML = `
        <img src="${photo.url}" alt="${photo.caption}" loading="lazy" />
        <div class="photo-overlay"></div>
        ${photo.caption ? `<div class="photo-caption">${photo.caption}</div>` : ''}
      `;
      item.onclick = () => openLightbox(idx);
      grid.appendChild(item);
    });

    let currentIndex = 0;

    function openLightbox(index) {
      currentIndex = index;
      updateLightbox();
      document.getElementById('lightbox').classList.add('open');
      document.addEventListener('keydown', handleKeys);
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.removeEventListener('keydown', handleKeys);
    }

    function updateLightbox() {
      const photo = PHOTOS[currentIndex];
      document.getElementById('lightboxImg').src = photo.url;
      document.getElementById('lightboxInfo').textContent = 
        (photo.caption ? photo.caption + '  ·  ' : '') + (currentIndex + 1) + ' / ' + PHOTOS.length;
    }

    function lightboxStep(dir) {
      currentIndex = (currentIndex + dir + PHOTOS.length) % PHOTOS.length;
      updateLightbox();
    }

    function handleKeys(e) {
      if (e.key === 'ArrowLeft') lightboxStep(-1);
      if (e.key === 'ArrowRight') lightboxStep(1);
      if (e.key === 'Escape') closeLightbox();
    }

    document.getElementById('lightbox').onclick = function(e) {
      if (e.target === this) closeLightbox();
    };
  </script>
</body>
</html>
