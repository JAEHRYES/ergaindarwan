<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photography — Erga Indarwan</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    .photo-page-section { background: var(--bg); padding: 4rem 0 6rem; }

    /* ── Folders Grid ── */
    .folders-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }
    .folders-view.hidden { display: none; }

    .folder-card {
      border: 1px solid var(--border-md);
      border-radius: 20px;
      overflow: hidden;
      background: var(--bg-card);
      cursor: pointer;
      transition: box-shadow var(--transition), transform var(--transition);
    }
    .folder-card:hover {
      box-shadow: 0 20px 60px rgba(30,30,28,0.12);
      transform: translateY(-4px);
    }

    .folder-mosaic {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      aspect-ratio: 1 / 0.9;
      overflow: hidden;
      gap: 2px;
      background: var(--border-md);
    }
    .folder-mosaic img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s var(--ease-out);
    }
    .folder-card:hover .folder-mosaic img { transform: scale(1.05); }
    .mosaic-empty {
      background: var(--bg-alt);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      opacity: 0.25;
    }

    .folder-info {
      padding: 1.1rem 1.4rem 1.3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .folder-info-left { display: flex; align-items: center; gap: 0.6rem; }
    .folder-flag { font-size: 1.4rem; line-height: 1; }
    .folder-name {
      font-family: var(--ff-serif);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--ink);
    }
    .folder-count {
      font-family: var(--ff-mono);
      font-size: 0.65rem;
      color: var(--ink-3);
      letter-spacing: 0.08em;
    }

    /* ── Album View ── */
    .album-view { display: none; }
    .album-view.active { display: block; }

    .album-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.04em;
      margin-bottom: 2rem;
      padding: 0.45rem 1rem 0.45rem 0.7rem;
      border-radius: 24px;
      border: 1px solid rgba(92,107,80,0.25);
      background: rgba(92,107,80,0.06);
      transition: all var(--transition);
      cursor: pointer;
    }
    .album-back-btn:hover {
      background: rgba(92,107,80,0.12);
      border-color: var(--accent);
    }

    .album-header {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 2rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border-md);
    }
    .album-flag { font-size: 2rem; line-height: 1; }
    .album-title {
      font-family: var(--ff-serif);
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .album-photo-count {
      font-family: var(--ff-mono);
      font-size: 0.7rem;
      color: var(--ink-3);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-left: auto;
      flex-shrink: 0;
    }

    /* Masonry grid */
    .album-grid { columns: 3; column-gap: 1rem; }
    @media (max-width: 860px) { .album-grid { columns: 2; } }
    @media (max-width: 500px)  { .album-grid { columns: 1; } }

    .album-photo-item {
      break-inside: avoid;
      margin-bottom: 1rem;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }
    .album-photo-item img {
      width: 100%; display: block;
      transition: transform 0.5s var(--ease-out);
    }
    .album-photo-item:hover img { transform: scale(1.03); }
    .photo-overlay {
      position: absolute; inset: 0;
      background: rgba(30,30,28,0);
      transition: background var(--transition);
      border-radius: 12px;
    }
    .album-photo-item:hover .photo-overlay { background: rgba(30,30,28,0.18); }
    .album-photo-caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 0.6rem 0.85rem;
      background: linear-gradient(to top, rgba(30,30,28,0.55), transparent);
      font-family: var(--ff-mono);
      font-size: 0.65rem;
      color: rgba(244,241,235,0.85);
      letter-spacing: 0.06em;
      opacity: 0;
      transition: opacity var(--transition);
      border-radius: 0 0 12px 12px;
    }
    .album-photo-item:hover .album-photo-caption { opacity: 1; }

    /* ── Lightbox ── */
    .lightbox {
      display: none;
      position: fixed; inset: 0;
      z-index: 600;
      background: rgba(20,20,18,0.92);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .lightbox.open { display: flex; }
    .lightbox-close {
      position: absolute;
      top: 1.5rem; right: 1.5rem;
      width: 42px; height: 42px;
      border-radius: 50%;
      background: rgba(244,241,235,0.08);
      color: rgba(244,241,235,0.7);
      font-size: 1.2rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background var(--transition), color var(--transition);
      border: none;
    }
    .lightbox-close:hover { background: rgba(244,241,235,0.16); color: #f4f1eb; }
    .lightbox-img {
      max-width: 88vw; max-height: 80vh;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.5);
    }
    .lightbox-nav {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      background: rgba(244,241,235,0.08);
      color: rgba(244,241,235,0.7);
      font-size: 1.8rem;
      width: 48px; height: 48px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background var(--transition), color var(--transition);
      border: none;
    }
    .lightbox-nav:hover { background: rgba(244,241,235,0.16); color: #f4f1eb; }
    .lightbox-prev { left: 1.5rem; }
    .lightbox-next { right: 1.5rem; }
    .lightbox-caption {
      position: absolute;
      bottom: 1.75rem;
      left: 50%; transform: translateX(-50%);
      font-family: var(--ff-mono);
      font-size: 0.72rem;
      color: rgba(244,241,235,0.45);
      letter-spacing: 0.1em;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-name"><a href="index.html">Erga Indarwan</a></div>
    <nav class="header-nav">
      <a href="interests.html">Interests</a>
      <a href="projects.html">Projects</a>
      <a href="photography.html" class="active">Photography</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <div class="header-role">Coder &amp; Engineer</div>
  </header>

  <section class="page-hero">
    <div class="page-hero-inner">
      <div class="section-tag reveal">Photography</div>
      <h1 class="page-hero-title reveal">Places I've<br /><em>Been To.</em></h1>
      <p class="page-hero-sub reveal" data-delay="100">Moments captured across different corners of the world.</p>
    </div>
    <div class="page-hero-bg-text" aria-hidden="true">PHOTOS</div>
  </section>

  <section class="section photo-page-section">
    <div class="section-inner">
      <div class="folders-view" id="foldersView"></div>
      <div id="albumContainer"></div>
    </div>
  </section>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <button class="lightbox-nav lightbox-prev" onclick="lightboxStep(-1)">‹</button>
    <img class="lightbox-img" id="lightboxImg" src="" alt="" />
    <button class="lightbox-nav lightbox-next" onclick="lightboxStep(1)">›</button>
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

  <footer class="site-footer">
    <span>© 2025 Erga Indarwan</span>
    <span class="footer-sep">·</span>
    <span>Built with care &amp; caffeine</span>
  </footer>

  <button class="back-to-top" id="backToTop" aria-label="Back to top" onclick="scrollToTop()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="18 15 12 9 6 15"/>
    </svg>
  </button>

  <script src="script.js"></script>
  <script>
    /* ═══════════════════════════════════════════════════════════════
       ✏️  YOUR PHOTOS — only edit this part
       ───────────────────────────────────────────────────────────────
       How it works:
         - Each key (e.g. "indonesia") must match the folder name on disk
         - Put your photos inside that folder: indonesia/photo1.jpg
         - List each filename under photos: []
         - Caption is optional — use '' to leave it blank
         - The first 4 photos automatically become the mosaic preview
         - To add a new country: copy one block, update key/label/flag/photos
    ═══════════════════════════════════════════════════════════════ */

    const ALBUMS = {

      indonesia: {
        label: 'Indonesia',
        flag:  '🇮🇩',
        photos: [
          { file: 'photo1indonesia.jpg', caption: 'Bali, 2023' },
          { file: 'photo2indonesia.jpg', caption: 'Ubud Rice Fields' },
          { file: 'photo3indonesia.jpg', caption: 'Tanah Lot' },
          { file: 'photo4indonesia.jpg', caption: 'Jakarta Streets' },
          { file: 'photo5indonesia.jpg', caption: 'Bali, 2023' },
          { file: 'photo6indonesia.jpg', caption: 'Ubud Rice Fields' },
          { file: 'photo7indonesia.jpg', caption: 'Tanah Lot' },
          { file: 'photo8indonesia.jpg', caption: 'Jakarta Streets' },
          // keep adding lines here ↓
          // { file: 'photo5.jpg', caption: 'Komodo Island' },
        ],
      },
japan: {
        label: 'Japan',
        flag:  '🇯🇵',
        photos: [
          { file: 'IMG_2119.jpg', caption: 'Tokyo Skyline' },
          { file: 'IMG_2188.jpg', caption: 'Shibuya Crossing' },
          { file: 'IMG_2237.jpg', caption: 'Arashiyama Bamboo' },
          { file: 'IMG_2242.jpg', caption: 'Mount Fuji' },
          { file: 'IMG_2247.jpg', caption: 'Tokyo Skyline' },
          { file: 'IMG_2329.jpg', caption: 'Shibuya Crossing' },
          { file: 'IMG_2368.jpg', caption: 'Arashiyama Bamboo' },
          { file: 'IMG_2372.jpg', caption: 'Mount Fuji' },
          { file: 'IMG_2390.jpg', caption: 'Tokyo Skyline' },
          { file: 'IMG_2410.jpg', caption: 'Shibuya Crossing' },
          { file: 'IMG_2441.jpg', caption: 'Arashiyama Bamboo' },
          { file: 'IMG_2487.jpg', caption: 'Mount Fuji' },
          { file: 'IMG_2527.jpg', caption: 'Tokyo Skyline' },
        ],
      },

      singapore: {
        label: 'Singapore',
        flag:  '🇸🇬',
        photos: [
          { file: 'photo1.jpg', caption: 'Marina Bay' },
          { file: 'photo2.jpg', caption: 'Gardens by the Bay' },
          { file: 'photo3.jpg', caption: 'Chinatown' },
          { file: 'photo4.jpg', caption: 'Sentosa' },
          // { file: 'photo5.jpg', caption: '' },
        ],
      },

      
      malaysia: {
        label: 'Malaysia',
        flag:  '🇲🇾',
        photos: [
          { file: 'photo1.jpg', caption: 'Petronas Towers, KL' },
          { file: 'photo2.jpg', caption: 'Batu Caves' },
          { file: 'photo3.jpg', caption: 'Penang Street Art' },
          { file: 'photo4.jpg', caption: 'Langkawi' },
        ],
      },

    };

    /* ═══════════════════════════════════════════════════════════════
       Engine — no need to touch anything below
    ═══════════════════════════════════════════════════════════════ */

    const foldersView    = document.getElementById('foldersView');
    const albumContainer = document.getElementById('albumContainer');

    Object.entries(ALBUMS).forEach(([key, album], folderIdx) => {
      const count   = album.photos.length;
      const preview = album.photos.slice(0, 4);

      // 2×2 mosaic tiles
      let mosaicHTML = '';
      for (let i = 0; i < 4; i++) {
        if (preview[i]) {
          mosaicHTML += `<img src="${key}/${preview[i].file}" alt="${album.label}" />`;
        } else {
          mosaicHTML += `<div class="mosaic-empty">📷</div>`;
        }
      }

      // Folder card — note "reveal in-view" so it's visible immediately
      // (cards are built by JS after the scroll observer has already run)
      const card = document.createElement('div');
      card.className = 'folder-card reveal in-view';
      card.style.transitionDelay = (folderIdx * 80) + 'ms';
      card.innerHTML = `
        <div class="folder-mosaic">${mosaicHTML}</div>
        <div class="folder-info">
          <div class="folder-info-left">
            <span class="folder-flag">${album.flag}</span>
            <span class="folder-name">${album.label}</span>
          </div>
          <span class="folder-count">${count} photo${count !== 1 ? 's' : ''}</span>
        </div>
      `;
      card.addEventListener('click', () => openFolder(key));
      foldersView.appendChild(card);

      // Masonry photo grid
      let photosHTML = '';
      album.photos.forEach((photo, idx) => {
        photosHTML += `
          <div class="album-photo-item" data-folder="${key}" data-idx="${idx}">
            <img src="${key}/${photo.file}" alt="${photo.caption || album.label}" loading="lazy" />
            <div class="photo-overlay"></div>
            ${photo.caption ? `<div class="album-photo-caption">${photo.caption}</div>` : ''}
          </div>
        `;
      });

      // Album view
      const albumEl = document.createElement('div');
      albumEl.className = 'album-view';
      albumEl.id = 'album-' + key;
      albumEl.innerHTML = `
        <button class="album-back-btn" onclick="closeFolder()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          All Locations
        </button>
        <div class="album-header">
          <span class="album-flag">${album.flag}</span>
          <h2 class="album-title">${album.label}</h2>
          <span class="album-photo-count">${count} photo${count !== 1 ? 's' : ''}</span>
        </div>
        <div class="album-grid">${photosHTML}</div>
      `;
      albumContainer.appendChild(albumEl);
    });

    // Lightbox click delegation
    albumContainer.addEventListener('click', (e) => {
      const item = e.target.closest('.album-photo-item');
      if (!item) return;
      openLightbox(item.dataset.folder, parseInt(item.dataset.idx));
    });

    // ── Folder navigation ──────────────────────────────────────────
    function openFolder(key) {
      foldersView.classList.add('hidden');
      document.querySelectorAll('.album-view').forEach(v => v.classList.remove('active'));
      document.getElementById('album-' + key).classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeFolder() {
      foldersView.classList.remove('hidden');
      document.querySelectorAll('.album-view').forEach(v => v.classList.remove('active'));
    }

    // ── Lightbox ───────────────────────────────────────────────────
    let lbPhotos = [];
    let lbIndex  = 0;

    function openLightbox(folderKey, idx) {
      lbPhotos = ALBUMS[folderKey].photos.map(p => ({
        src:     folderKey + '/' + p.file,
        caption: p.caption || '',
      }));
      lbIndex = idx;
      updateLightbox();
      document.getElementById('lightbox').classList.add('open');
      document.addEventListener('keydown', lbKeyHandler);
    }

    function updateLightbox() {
      const p = lbPhotos[lbIndex];
      document.getElementById('lightboxImg').src = p.src;
      document.getElementById('lightboxCaption').textContent =
        (p.caption ? p.caption + '  ·  ' : '') + (lbIndex + 1) + ' / ' + lbPhotos.length;
    }

    function lightboxStep(dir) {
      lbIndex = (lbIndex + dir + lbPhotos.length) % lbPhotos.length;
      updateLightbox();
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.removeEventListener('keydown', lbKeyHandler);
    }

    function lbKeyHandler(e) {
      if (e.key === 'ArrowLeft')  lightboxStep(-1);
      if (e.key === 'ArrowRight') lightboxStep(1);
      if (e.key === 'Escape')     closeLightbox();
    }

    document.getElementById('lightbox').addEventListener('click', function(e) {
      if (e.target === this) closeLightbox();
    });
  </script>
</body>
</html>
